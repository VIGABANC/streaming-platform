name: VEYRA live provider smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Public Vercel URL to inspect
        required: false
        default: https://streaming-platform-beryl.vercel.app

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_LIVE_BASE_URL: ${{ inputs.base_url }}
      PLAYWRIGHT_TEST_BASE_URL: ${{ inputs.base_url }}
      VEYRA_LIVE_SMOKE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
      - name: Run isolated live smoke suite
        run: npm run test:live
